<H1 ALIGN=CENTER> 
ShZZaM: An LLM+ATP Natural Language to Logic Translator
</H1>

<H3> Abstract </H3>

This talk describes ShZZaM, a tool that translates natural
language to typed first-order logic, using Large Language Models (LLMs)
and Automated Theorem Proving (ATP).
