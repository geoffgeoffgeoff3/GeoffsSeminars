<H1 ALIGN=CENTER> 
Verifying LLM Answers with ShZZaM and ATP
</H1>

<H3> Abstract </H3>

This talk describes a process for verifying the answer produced by an LLM by (i)&nbsp;translating
the question to logic using the ShZZaM tool, (ii)&nbsp;answering the logic question using ATP,
and (iii)&nbsp;comparing the LLM's answer to the ATP answer.
